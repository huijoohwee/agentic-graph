<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="-64 -32 128 80" role="img" aria-labelledby="title description"><title id="title">Warehouse concept — logistics allocation and drone inspection cell</title><desc id="description">Assumed 60 by 40 metre indoor warehouse with 80 percent logistics and 20 percent ancillary. West inbound and east outbound container bays, dock levelers and 12 metre maneuvering aisles. A 16 by 16 metre bounded simulation cell contains the nine-second inspection route. Not an approved building plan.</desc><rect x="-64" y="-32" width="128" height="80" fill="#f8faf9"></rect><g font-family="system-ui, sans-serif" fill="#273e4c"><text x="-60" y="-28.7" font-size="1.8" font-weight="700">WAREHOUSE / FLIGHT INSPECTION CONCEPT</text><text x="-60" y="-26.6" font-size="1">B2 ramp-up brief · assumed dimensions · north ↑ · metres</text></g><g font-family="system-ui, sans-serif"><path d="M -54 -20 V 24 H 54 V -20" fill="none" stroke="#d9dfe1" stroke-width="12"></path><path d="M -54 -20 V 24 H 54 V -20" fill="none" stroke="#89969c" stroke-width=".12" stroke-dasharray="1 1"></path><path d="M -60 20 H 60 V 28 H -60 Z" fill="#d9dfe1" stroke="#b0b9be" stroke-width=".1"></path><text x="0" y="26" text-anchor="middle" fill="#334755" font-size="1">8 m access / ramp connection →</text><text transform="translate(-57 -2) rotate(-90)" text-anchor="middle" fill="#334755" font-size="1">12 m container maneuvering aisle</text><text transform="translate(57 -2) rotate(90)" text-anchor="middle" fill="#334755" font-size="1">12 m container maneuvering aisle</text><g><rect x="-48" y="-7" width="18" height="4" fill="#f4efe3" stroke="#b19a6d" stroke-width=".18" stroke-dasharray=".5 .2"></rect><text x="-39" y="-5.4" text-anchor="middle" fill="#334755" font-size=".95">Inbound bay 1 · 20/40 ft</text><text x="-39" y="-4.1" text-anchor="middle" fill="#57626a" font-size=".8">4 × 18 m container bay</text><rect x="-30.8" y="-6.2" width="1.6" height="2.4" fill="#596c7a" stroke="#edf4f8" stroke-width=".14"><title>Dock leveler · Inbound bay 1</title></rect></g><g><rect x="-48" y="-1" width="18" height="4" fill="#f4efe3" stroke="#b19a6d" stroke-width=".18" stroke-dasharray=".5 .2"></rect><text x="-39" y="0.6000000000000001" text-anchor="middle" fill="#334755" font-size=".95">Inbound bay 2 · 20/40 ft</text><text x="-39" y="1.9" text-anchor="middle" fill="#57626a" font-size=".8">4 × 18 m container bay</text><rect x="-30.8" y="-0.19999999999999996" width="1.6" height="2.4" fill="#596c7a" stroke="#edf4f8" stroke-width=".14"><title>Dock leveler · Inbound bay 2</title></rect></g><g><rect x="30" y="-7" width="18" height="4" fill="#f4efe3" stroke="#b19a6d" stroke-width=".18" stroke-dasharray=".5 .2"></rect><text x="39" y="-5.4" text-anchor="middle" fill="#334755" font-size=".95">Outbound bay 1 · 20/40 ft</text><text x="39" y="-4.1" text-anchor="middle" fill="#57626a" font-size=".8">4 × 18 m container bay</text><rect x="29.2" y="-6.2" width="1.6" height="2.4" fill="#596c7a" stroke="#edf4f8" stroke-width=".14"><title>Dock leveler · Outbound bay 1</title></rect></g><g><rect x="30" y="3" width="18" height="4" fill="#f4efe3" stroke="#b19a6d" stroke-width=".18" stroke-dasharray=".5 .2"></rect><text x="39" y="4.6" text-anchor="middle" fill="#334755" font-size=".95">Outbound bay 2 · 20/40 ft</text><text x="39" y="5.9" text-anchor="middle" fill="#57626a" font-size=".8">4 × 18 m container bay</text><rect x="29.2" y="3.8" width="1.6" height="2.4" fill="#596c7a" stroke="#edf4f8" stroke-width=".14"><title>Dock leveler · Outbound bay 2</title></rect></g><text x="-40" y="7.8" text-anchor="middle" fill="#334755" font-size=".9">INBOUND → · DL = dock leveler</text><text x="40" y="10" text-anchor="middle" fill="#334755" font-size=".9">OUTBOUND → · DL at each dock</text><rect x="-30" y="-20" width="60" height="40" fill="#eef1ed" stroke="#556570" stroke-width=".35"></rect><g><rect x="-29.88" y="-19.88" width="9.76" height="9.76" fill="#8c9cae" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-29.35" y="-18.35" font-size=".76" fill="#253e4d">High-value vault</text><text x="-29.35" y="-17.2" font-size=".75" fill="#425762">100 m² · core</text></g><g><rect x="-19.88" y="-19.88" width="13.76" height="9.76" fill="#8ebbc8" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-19.35" y="-18.35" font-size=".95" fill="#253e4d">Climate storage</text><text x="-19.35" y="-17.2" font-size=".75" fill="#425762">140 m² · core</text></g><g><rect x="-5.88" y="-19.88" width="17.76" height="9.76" fill="#a0baa6" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-5.35" y="-18.35" font-size=".95" fill="#253e4d">Kitting / assembly</text><text x="-5.35" y="-17.2" font-size=".75" fill="#425762">180 m² · core</text></g><g><rect x="12.12" y="-19.88" width="17.76" height="9.76" fill="#c6b194" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="12.65" y="-18.35" font-size=".95" fill="#253e4d">Packing / staging</text><text x="12.65" y="-17.2" font-size=".75" fill="#425762">180 m² · core</text></g><g><rect x="-29.88" y="-9.88" width="9.76" height="9.76" fill="#a4bacf" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-29.35" y="-8.35" font-size=".76" fill="#253e4d">Receiving / security</text><text x="-29.35" y="-7.2" font-size=".75" fill="#425762">100 m² · core</text></g><g><rect x="-29.88" y="0.12" width="9.76" height="11.76" fill="#c2b79e" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-29.35" y="1.65" font-size=".76" fill="#253e4d">Loose / bulk goods</text><text x="-29.35" y="2.8" font-size=".75" fill="#425762">120 m² · core</text></g><g><rect x="-19.88" y="-9.88" width="31.76" height="21.76" fill="#bbc8c6" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-19.35" y="-8.35" font-size=".95" fill="#253e4d">Pallet racks / logistics aisles</text><text x="-19.35" y="-7.2" font-size=".75" fill="#425762">704 m² · core</text></g><g><rect x="12.12" y="-9.88" width="7.76" height="21.76" fill="#b5bd9c" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="12.65" y="-8.35" font-size=".76" fill="#253e4d">Small-item shelving</text><text x="12.65" y="-7.2" font-size=".75" fill="#425762">176 m² · core</text></g><g><rect x="20.12" y="-9.88" width="9.76" height="21.76" fill="#cab1a1" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="20.65" y="-8.35" font-size=".76" fill="#253e4d">Outbound shipping</text><text x="20.65" y="-7.2" font-size=".75" fill="#425762">220 m² · core</text></g><g><rect x="-29.88" y="12.12" width="23.76" height="7.76" fill="#c4bccf" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-29.35" y="13.65" font-size=".95" fill="#253e4d">Support / WC / M&amp;E</text><text x="-29.35" y="14.8" font-size=".75" fill="#425762">192 m² · ancillary</text></g><g><rect x="-5.88" y="12.12" width="11.76" height="7.76" fill="#cfc3ad" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="-5.35" y="13.65" font-size=".95" fill="#253e4d">Staff break / pantry</text><text x="-5.35" y="14.8" font-size=".75" fill="#425762">96 m² · ancillary</text></g><g><rect x="6.12" y="12.12" width="23.76" height="7.76" fill="#bec5d5" fill-opacity=".6" stroke="#74858b" stroke-width=".08"></rect><text x="6.65" y="13.65" font-size=".95" fill="#253e4d">Office / front entry</text><text x="6.65" y="14.8" font-size=".75" fill="#425762">192 m² · ancillary</text></g><g><rect x="-19" y="-5.75" width="8" height="1.5" fill="#e0ab77" stroke="#527c91" stroke-width=".14"></rect><path d="M -19 -5 h 8" stroke="#527c91" stroke-width=".12"></path></g><g><rect x="-19" y="3.25" width="8" height="1.5" fill="#e0ab77" stroke="#527c91" stroke-width=".14"></rect><path d="M -19 4 h 8" stroke="#527c91" stroke-width=".12"></path></g><g><rect x="13" y="-5.4" width="6" height="0.8" fill="#ceb48c" stroke="#527c91" stroke-width=".14"></rect><path d="M 13 -5 h 6" stroke="#527c91" stroke-width=".12"></path></g><g><rect x="13" y="3.6" width="6" height="0.8" fill="#ceb48c" stroke="#527c91" stroke-width=".14"></rect><path d="M 13 4 h 6" stroke="#527c91" stroke-width=".12"></path></g><path d="M -28 -5 H -22 M -22 -5 l -1 -.5 m 1 .5 l -1 .5 M 22 6 H 28 m -1 -.5 l 1 .5 l -1 .5" fill="none" stroke="#4a7383" stroke-width=".25"></path><path d="M 12 20 h 4" stroke="#eff9ff" stroke-width=".5"></path><text x="18" y="19" fill="#334755" font-size=".75">Staff entry ↑</text><g fill="#334755" stroke="#5c7484" stroke-width=".1"><path d="M -30 -22 H 30 M -30 -22.6 V -21.4 M 30 -22.6 V -21.4"></path><text x="0" y="-22.8" text-anchor="middle" font-size="1" stroke="none">60.00 m</text><path d="M 31.5 -20 V 20 M 31 -20 H 32 M 31 20 H 32"></path><text transform="translate(32.8 12) rotate(-90)" font-size="1" stroke="none">40.00 m</text></g><text x="0" y="31" text-anchor="middle" fill="#334755" font-size="1">2,400 m² indoor concept · 80% logistics / 20% ancillary · assumed dimensions</text></g><rect x="-8" y="-8" width="16" height="16" fill="#e9f5ff" fill-opacity=".7" stroke="#277bc3" stroke-width=".2" stroke-dasharray=".5 .3"></rect><g font-family="system-ui, sans-serif" fill="#204767"><text x="-7.5" y="-6.8" font-size=".7">16 × 16 m inspection cell</text><text x="-7.5" y="-5.7" font-size=".65">Altitude 0–4 m · simulation only</text></g><g><rect x="1.6" y="-0.6" width="0.8" height="1.2" fill="#b99d74" stroke="#326481" stroke-width=".12"></rect><text x="2" y="0.15" text-anchor="middle" font-family="system-ui, sans-serif" font-size=".52" fill="#273e4c">Pallet load</text></g><g><rect x="-4" y="-3" width="12" height="1.2" fill="#dd9553" stroke="#326481" stroke-width=".12"></rect><text x="2" y="-2.25" text-anchor="middle" font-family="system-ui, sans-serif" font-size=".52" fill="#273e4c">North pallet rack</text></g><g><rect x="-4" y="1.7999999999999998" width="12" height="1.2" fill="#dd9553" stroke="#326481" stroke-width=".12"></rect><text x="2" y="2.55" text-anchor="middle" font-family="system-ui, sans-serif" font-size=".52" fill="#273e4c">South pallet rack</text></g><path d="M 0 0 H 4" stroke="#287fd1" stroke-width=".18" stroke-dasharray=".3 .1"></path><circle r=".5" fill="#287fd1"></circle><circle cx="4" r=".5" fill="#399775"></circle><g font-family="system-ui, sans-serif" fill="#273e4c" font-size="1.05"><text x="-60" y="35">FLOW: receive → security → store → kit → pack → dispatch</text><text x="-60" y="37.5">CORE 1,920 m² (80%) · ANCILLARY 480 m² (20%) · TOTAL 2,400 m²</text><text x="-60" y="40">Break / pantry is staff support, not residential accommodation. Exterior aprons are outside this indoor allocation.</text><text x="-60" y="42.5">Concept meets the requested 60:40 planning ratio. Surveyed GFA, vehicle swept paths, ramps and approvals remain unverified.</text><text x="-60" y="45">Drone: take off 2 m → hover 1 s → fly 4 m at 1 m/s → land. No motors; no autonomous navigation.</text></g></svg>
