# Cloudflare Worker: agentic-mcp
#
# Hosts the Agents SDK `McpAgent` exposing MCP Streamable HTTP transport at
# airvio.co/agentic-os/control-plane/mcp (see agentic-graph-acos-mcp-connector spec, ADR-7).
#
# Route note: this Worker now owns a dedicated control-plane endpoint so the
# published Pages agent-ready surface can continue serving `/agentic-graph/mcp`
# without route shadowing. Keep the Pages route for public discovery/read-only
# MCP and reserve this Worker for the Streamable HTTP Director control plane.

name = "agentic-mcp"
main = "index.ts"
compatibility_date = "2026-07-13"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = false
preview_urls = false

[secrets]
required = [ "AGENTIC_OS_AGENT_RUNTIME_BEARER_TOKEN" ]

[observability]
enabled = true

[vars]
AGENTIC_OS_MCP_PUBLIC_BASE_URL = "https://airvio.co"
AGENTIC_OS_MCP_TOOL_LIST_NAME = "agentic-video-remix"
# Live SME Care execution also requires an operator-selected model identifier.
# Keep it out of the repository default and configure AGENTIC_OS_AGENT_MODEL_ID
# in the target Worker environment before requesting bounded live proof.
# Required before serving authenticated MCP, agent-run POST, or persisted-run reads:
#   npx wrangler secret put AGENTIC_OS_AGENT_RUNTIME_BEARER_TOKEN --config cloudflare/workers/agentic-graph-mcp/wrangler.toml
# task 12.5 — env-gated live/mock stage clients. Default "0" keeps the Director
# on deterministic mocks (zero live/paid calls). Flip to "1" to enable live
# clients, or provide a provider credential as a SECRET (not a var):
#   npx wrangler secret put EXA_API_KEY --config cloudflare/workers/agentic-graph-mcp/wrangler.toml
# When EXA_API_KEY is present the Exa client uses api-key-header mode; with only
# AGENTIC_OS_LIVE_CLIENTS="1" it uses Exa hosted-free mode. EXA_MCP_ENDPOINT is
# optional (defaults to https://mcp.exa.ai/mcp).
AGENTIC_OS_LIVE_CLIENTS = "0"
TRAVEL_AGENT_DEFINITIONS_JSON = '[{"agentId":"agent-flight","declaredCategory":"flight"},{"agentId":"agent-experience","declaredCategory":"experience"}]'
TRAVEL_DISCOVERY_MODE = "live"
TRAVEL_DISCOVERY_DEADLINE_MS = "6000"
TRAVEL_SETTLEMENT_CURRENCY = "SGD"
COMMERCE_PROVIDER_SOURCE_REVISION = "0000000000000000000000000000000000000000"
COMMERCE_PROVIDER_STORAGE_REVISION = "commerce-discovery-mcp-v1"
COMMERCE_PROVIDER_VERSION_ID = "production-unreleased"
# task 12.4 live stage clients (optional; set the endpoint + provide the key as
# a SECRET via `wrangler secret put <NAME>`). Absent → that stage uses its mock.
#   Storyboard (USABLE NOW): AI_GATEWAY_CHAT_URL + BYTEPLUS_API_KEY (or AI_GATEWAY_TOKEN),
#     optional BYTEPLUS_CHAT_MODEL (default "skylark-chat").
#   Render: AI_GATEWAY_VIDEO_URL + BYTEPLUS_API_KEY (default) or RENDER_PROVIDER=strytree + STRYTREE_RENDER_URL + STRYTREE_API_KEY.
#   Commerce: AGENTIC_OS_PAYMENT_URL + AGENTIC_OS_PAYMENT_API_KEY.

# Streamable HTTP transport endpoint per Requirement R14.1.
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "TRAVEL_AGENT_DEFINITION_CACHE"
# Created by the first accepted production publish attempt.  Pin the ID so
# retries reuse the namespace instead of attempting a duplicate create.
id = "5785814f38814f399d5681346737b3d0"

# Travel providers are intentionally not bound in production until their
# independently deployed `agentic-travel-*` Workers exist.  Travel routes
# remain fail-closed (503 with the missing binding reported); MCP, agent-run,
# tool discovery, and durable Run_Manifest APIs do not depend on them.

[[routes]]
pattern = "airvio.co/agentic-os/control-plane/mcp"
zone_name = "airvio.co"

[[routes]]
pattern = "airvio.co/agentic-os/control-plane/mcp/*"
zone_name = "airvio.co"

[[routes]]
pattern = "airvio.co/agentic-os/control-plane/agents"
zone_name = "airvio.co"

[[routes]]
pattern = "airvio.co/agentic-os/control-plane/agents/*"
zone_name = "airvio.co"

# McpAgent maintains per-session state in a Durable Object. Task 1.2 adds a
# separate `RunManifestStore` DO that persists each Director Run_Manifest
# under one DO instance per `runId`, so a `GET /agentic-os/control-plane/mcp/runs/{id}`
# read-back returns the latest persisted state with read-after-write
# consistency (R14.2 / Property 25).
[[durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "AgenticGraphMcpAgent"

[[durable_objects.bindings]]
name = "RUN_MANIFEST_STORE"
class_name = "RunManifestStore"

[[migrations]]
tag = "v1_agenticgraph_mcp_agent"
new_sqlite_classes = [ "AgenticGraphMcpAgent" ]

[[migrations]]
tag = "v2_run_manifest_store"
new_sqlite_classes = [ "RunManifestStore" ]

# The deployed legacy Worker owns persisted MCP sessions under this class.
# Preserve those objects while completing the public namespace migration.
[[migrations]]
tag = "v3_rename_knowgrph_mcp_agent"
renamed_classes = [{ from = "KnowgrphMcpAgent", to = "AgenticGraphMcpAgent" }]

# Isolated live staging. This is deliberately distinct from env.dev so a
# deterministic demo deployment can never satisfy a live travel binding.
[env.staging]
name = "agentic-mcp-staging"
workers_dev = false
preview_urls = false
routes = []

[env.staging.secrets]
required = [ "AGENTIC_OS_AGENT_RUNTIME_BEARER_TOKEN" ]

[env.staging.observability]
enabled = true

[env.staging.vars]
AGENTIC_OS_MCP_PUBLIC_BASE_URL = "https://agentic-mcp-staging.huijoohwee.workers.dev"
AGENTIC_OS_MCP_TOOL_LIST_NAME = "agentic-video-remix-staging"
AGENTIC_OS_LIVE_CLIENTS = "0"
TRAVEL_AGENT_DEFINITIONS_JSON = '[{"agentId":"agent-flight","declaredCategory":"flight"},{"agentId":"agent-experience","declaredCategory":"experience"}]'
TRAVEL_DISCOVERY_MODE = "live"
TRAVEL_DISCOVERY_DEADLINE_MS = "6000"
TRAVEL_SETTLEMENT_CURRENCY = "SGD"
COMMERCE_PROVIDER_SOURCE_REVISION = "0000000000000000000000000000000000000000"
COMMERCE_PROVIDER_STORAGE_REVISION = "commerce-discovery-mcp-v1"
COMMERCE_PROVIDER_VERSION_ID = "staging-unreleased"

[env.staging.ai]
binding = "AI"

[[env.staging.kv_namespaces]]
binding = "TRAVEL_AGENT_DEFINITION_CACHE"

[[env.staging.services]]
binding = "TRAVEL_DISCOVERY_HARNESS"
service = "agentic-travel-discovery-staging"

[[env.staging.services]]
binding = "TRAVEL_EXPERIENCE_DISCOVERY_HARNESS"
service = "agentic-travel-experience-discovery-staging"

[[env.staging.services]]
binding = "TRAVEL_GUARDRAIL"
service = "agentic-travel-commerce-staging"
entrypoint = "TravelAgencyGuardrailService"

[[env.staging.durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "AgenticGraphMcpAgent"

[[env.staging.durable_objects.bindings]]
name = "RUN_MANIFEST_STORE"
class_name = "RunManifestStore"

[[env.staging.migrations]]
tag = "v1_agenticgraph_mcp_agent"
new_sqlite_classes = [ "AgenticGraphMcpAgent" ]

[[env.staging.migrations]]
tag = "v2_run_manifest_store"
new_sqlite_classes = [ "RunManifestStore" ]

# Isolated proof environment. It deliberately has no custom-domain routes and
# cannot shadow the production control plane.
[env.dev]
name = "agentic-mcp-dev"
workers_dev = true
preview_urls = true
routes = []

[env.dev.secrets]
required = [ "AGENTIC_OS_AGENT_RUNTIME_BEARER_TOKEN" ]

[env.dev.observability]
enabled = true

[env.dev.vars]
AGENTIC_OS_MCP_PUBLIC_BASE_URL = "https://agentic-mcp-dev.huijoohwee.workers.dev"
AGENTIC_OS_MCP_TOOL_LIST_NAME = "agentic-video-remix-dev"
AGENTIC_OS_LIVE_CLIENTS = "0"
TRAVEL_AGENT_DEFINITIONS_JSON = '[{"agentId":"agent-flight","declaredCategory":"flight"},{"agentId":"agent-hotel","declaredCategory":"hotel"},{"agentId":"agent-experience","declaredCategory":"experience"}]'
TRAVEL_DISCOVERY_MODE = "deterministic-demo"
TRAVEL_DISCOVERY_DEADLINE_MS = "6000"
TRAVEL_SETTLEMENT_CURRENCY = "SGD"
COMMERCE_PROVIDER_SOURCE_REVISION = "0000000000000000000000000000000000000000"
COMMERCE_PROVIDER_STORAGE_REVISION = "commerce-discovery-mcp-v1"
COMMERCE_PROVIDER_VERSION_ID = "dev-unreleased"
TRAVEL_DEMO_QUOTE_RULES_JSON = '{"flight":{"deltaMinor":50},"hotel":{"deltaMinor":25},"experience":{"deltaMinor":10}}'

[env.dev.ai]
binding = "AI"

[[env.dev.kv_namespaces]]
binding = "TRAVEL_AGENT_DEFINITION_CACHE"

[[env.dev.services]]
binding = "TRAVEL_DISCOVERY_HARNESS"
service = "agentic-travel-discovery-staging"

[[env.dev.services]]
binding = "TRAVEL_GUARDRAIL"
service = "agentic-travel-commerce"
entrypoint = "TravelAgencyGuardrailService"

[[env.dev.durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "AgenticGraphMcpAgent"

[[env.dev.durable_objects.bindings]]
name = "RUN_MANIFEST_STORE"
class_name = "RunManifestStore"

[[env.dev.migrations]]
tag = "v1_agenticgraph_mcp_agent"
new_sqlite_classes = [ "AgenticGraphMcpAgent" ]

[[env.dev.migrations]]
tag = "v2_run_manifest_store"
new_sqlite_classes = [ "RunManifestStore" ]
