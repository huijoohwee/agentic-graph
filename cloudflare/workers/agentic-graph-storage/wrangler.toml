name = "agentic-storage"
main = "index.ts"
compatibility_date = "2026-05-07"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[vars]
SHARED_NODE_MAX_DELTA_BYTES = "65536"
SHARED_NODE_MAX_PAYLOAD_BYTES = "262144"
SHARED_NODE_REPLAY_LOG_MAX_ENTRIES = "128"
SHARED_NODE_TRAVEL_DISPATCH_TIMEOUT_MS = "12000"
AGENTIC_OS_STORAGE_LOCAL_RUNTIME = "false"

# Operator-provisioned secrets (never commit their values):
# - AGENTIC_OS_TRAVEL_COMMERCE_API_TOKEN
# - SHARED_NODE_TRAVEL_BUNDLE_MAP_JSON (immutable exact locator, bundle, and
#   initialization-seed map; the Worker validates and fails closed)

# The optional travel-mutation dispatch stays unbound until its independently
# deployed `agentic-travel-*` Worker exists. The outbox reports this binding as
# unavailable and leaves core Canvas/storage operations unaffected.

[[routes]]
pattern = "airvio.co/api/storage/*"
zone_name = "airvio.co"

[[d1_databases]]
binding = "DB"
database_name = "agentic-storage"
database_id = "633355bf-1a52-4085-bd3c-eba4220ff152"
migrations_dir = "../../d1/migrations"

[[r2_buckets]]
binding = "AGENTIC_OS_STORAGE_BLOB_BUCKET"
bucket_name = "agentic-storage-blobs"

# Optional operator-owned KV binding for generated-media access URL cache.
# Bind a real namespace as AGENTIC_OS_MEDIA_ACCESS_KV before Cloudflare deployment.

[[durable_objects.bindings]]
name = "AGENTIC_OS_CANVAS_ROOM"
class_name = "AgenticGraphCanvasSyncRoom"

[[migrations]]
tag = "v1_knowgrph_canvas_sync_room"
new_sqlite_classes = [ "KnowgrphCanvasSyncRoom" ]

# Preserve existing Canvas room state while renaming the legacy DO class.
[[migrations]]
tag = "v2_rename_knowgrph_canvas_sync_room"
renamed_classes = [{ from = "KnowgrphCanvasSyncRoom", to = "AgenticGraphCanvasSyncRoom" }]
