name: Production Release
run-name: Production candidate ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha: { description: 'Exact protected main commit reviewed on localhost', required: true, type: string }
      local_review_candidate: { description: 'Exact agentic-local-review-candidate/v1 JSON from turn:end', required: true, type: string }
      release_evidence: { description: 'Exact release-frontier evidence JSON with the last-known-good rollback identity', required: true, type: string }
permissions:
  actions: read
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs: { docs_repository: '${{ steps.agentic_canvas_os_docs.outputs.repository }}', docs_revision: '${{ steps.agentic_canvas_os_docs.outputs.ref }}', manifest_digest: '${{ steps.immutable_manifest.outputs.digest }}', mirror_revision: '${{ steps.mirror_revision.outputs.revision }}', candidate_digest: '${{ steps.production_candidate.outputs.candidate_digest }}', lifecycle_candidate_digest: '${{ steps.lifecycle_candidate.outputs.candidate_digest }}' }
    env: { NODE_OPTIONS: '--max-old-space-size=4096', RELEASE_SHA: '${{ inputs.source_sha }}', KNOWGRPH_AGENTIC_CANVAS_OS_DOCS_ROOT: '${{ github.workspace }}/agentic-canvas-os/docs' }
    steps:
      - name: Checkout exact protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: '${{ inputs.source_sha }}', path: knowgrph, fetch-depth: 2 }
      - name: Verify checked-out commit
        working-directory: knowgrph
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
      - name: Checkout production mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: huijoohwee/huijoohwee, path: huijoohwee }
      - name: Capture production mirror base revision
        id: mirror_revision
        working-directory: huijoohwee
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout schema mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: huijoohwee/huijoohwee.github.io, path: huijoohwee.github.io }
      - name: Capture execution guideline revision
        id: guideline_revision
        working-directory: huijoohwee.github.io
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: "knowgrph/package-lock.json\nknowgrph/canvas/package-lock.json" }
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.11' }
      - name: Install dependencies
        working-directory: knowgrph
        run: bash ./scripts/install-production-release-dependencies.sh
      - name: Validate travel mesh release plan and local rollback simulation
        working-directory: knowgrph
        run: |
          node ./scripts/travel-mesh-release.mjs validate
          node --test ./scripts/__tests__/travel-mesh-release.test.mjs
      - name: Resolve Agentic Canvas OS docs dependency
        id: agentic_canvas_os_docs
        working-directory: knowgrph
        run: npm run --silent runtime:docs-dependency:resolve -- --github-output >> "$GITHUB_OUTPUT"
      - name: Checkout Agentic Canvas OS docs SSOT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.agentic_canvas_os_docs.outputs.repository }}
          ref: ${{ steps.agentic_canvas_os_docs.outputs.ref }}
          path: agentic-canvas-os
          fetch-depth: 0
      - name: Materialize and verify release evidence
        working-directory: knowgrph
        env: { LOCAL_REVIEW_CANDIDATE_JSON: '${{ inputs.local_review_candidate }}', RELEASE_EVIDENCE_JSON: '${{ inputs.release_evidence }}' }
        run: |
          npm run --silent release:candidate:authorization -- materialize-local-review --output "$RUNNER_TEMP/local-review-candidate.json"
          jq -e '
            if (type == "object"
            and .schema == "knowgrph-production-release-evidence/v1"
            and (keys | sort) == ([
              "captureAdapterId", "capturedAt", "convergenceBaseDigest", "entries",
              "inventoryDigest", "observations", "observedAt", "protectedTipDigest",
              "repository", "rollbackCapturedAt", "rollbackIdentity", "rollbackTargetDigest",
              "schema", "sourceEvidenceRefs", "sourceRevision", "successorWriteSetDigest"
            ] | sort)
            and (.entries | type == "array")
            and (.observations | type == "array")
            and (.sourceEvidenceRefs | type == "array")
            and .rollbackIdentity.schema == "knowgrph-production-rollback-identity/v1"
            and (.rollbackTargetDigest | test("^[0-9a-f]{64}$"))
            ) then . else error("release evidence preflight failed") end
          ' <<< "$RELEASE_EVIDENCE_JSON" > "$RUNNER_TEMP/release-evidence.json"
          npm run --silent release:candidate:authorization -- verify-local-review --local-review "$RUNNER_TEMP/local-review-candidate.json" --source-sha "$RELEASE_SHA" --source-tree "$(git rev-parse HEAD^{tree})" --docs-sha "${{ steps.agentic_canvas_os_docs.outputs.ref }}" --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os"
      - name: Create immutable release manifest
        id: immutable_manifest
        working-directory: knowgrph
        run: npm run --silent release:manifest:create -- --source-sha "$RELEASE_SHA" --target-ref "refs/heads/main" --output "$RUNNER_TEMP/immutable-release-manifest.json" --github-output
      - name: Validate dependency and immutable manifest
        working-directory: knowgrph
        run: |
          test "$(git -C ../agentic-canvas-os rev-parse HEAD)" = "${{ steps.agentic_canvas_os_docs.outputs.ref }}"
          npm run --silent release:manifest:check -- "$RUNNER_TEMP/immutable-release-manifest.json" --source-sha "$RELEASE_SHA" --docs-sha "${{ steps.agentic_canvas_os_docs.outputs.ref }}" --digest "${{ steps.immutable_manifest.outputs.digest }}"
      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'immutable-release-manifest-${{ inputs.source_sha }}', path: '${{ runner.temp }}/immutable-release-manifest.json', if-no-files-found: error, retention-days: 1 }
      - name: Reverify exact candidate
        working-directory: knowgrph
        run: npm run ci:integration
      - name: Build and sync verified candidate
        working-directory: knowgrph
        env: { KNOWGRPH_SOURCE_REVISION: '${{ inputs.source_sha }}', VITE_KNOWGRPH_STORAGE_BASE_URL: 'https://airvio.co' }
        run: npm run pages:build-sync
      - name: Verify source-to-mirror parity
        working-directory: knowgrph
        run: npm run conflict:mirror:check
      - name: Build Pages functions
        working-directory: knowgrph
        run: npm run pages:functions:build
      - name: Create verified mirror artifact manifest
        working-directory: knowgrph
        run: npm run --silent production:mirror-artifact:create -- ../huijoohwee
      - name: Bind immutable production candidate
        id: production_candidate
        working-directory: knowgrph
        run: |
          npm run --silent release:candidate:authorization -- create --local-review "$RUNNER_TEMP/local-review-candidate.json" --readiness "$GITHUB_WORKSPACE/huijoohwee/.well-known/runtime-readiness.json" --source-sha "$RELEASE_SHA" --source-tree "$(git rev-parse HEAD^{tree})" --docs-sha "${{ steps.agentic_canvas_os_docs.outputs.ref }}" --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os" --output "$RUNNER_TEMP/production-release-candidate.json" --github-output >> "$GITHUB_OUTPUT"
          {
            echo "## Production candidate awaiting human authorization"
            echo "- Source: \`$RELEASE_SHA\`"
            echo "- Agentic Canvas OS: \`${{ steps.agentic_canvas_os_docs.outputs.ref }}\`"
            echo "- Candidate digest: \`$(jq -r .candidateDigest "$RUNNER_TEMP/production-release-candidate.json")\`"
            echo "- Immutable manifest: \`${{ steps.immutable_manifest.outputs.digest }}\`"
            echo "- Authorize from an interactive terminal: \`npm run production:authorize -- --repository ${{ github.repository }} --run-id ${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create neutral release lifecycle receipts
        id: lifecycle_candidate
        working-directory: knowgrph
        run: |
          npm run --silent release:lifecycle:receipts -- create --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os/docs" --docs-sha "${{ steps.agentic_canvas_os_docs.outputs.ref }}" --local-review "$RUNNER_TEMP/local-review-candidate.json" --readiness "$GITHUB_WORKSPACE/huijoohwee/.well-known/runtime-readiness.json" --source-sha "$RELEASE_SHA" --source-tree "$(git rev-parse HEAD^{tree})" --docs-tree "$(git -C ../agentic-canvas-os rev-parse HEAD^{tree})" --guideline-sha "${{ steps.guideline_revision.outputs.revision }}" --mirror-revision "${{ steps.mirror_revision.outputs.revision }}" --actor-id "github:${{ github.actor }}" --device-id "github-hosted:${{ runner.os }}" --session-id "github-actions:${{ github.run_id }}:${{ github.run_attempt }}" --worktree-id "github-workspace:${{ github.run_id }}:verify" --branch-id "refs/heads/main" --scope-id "production-release:$RELEASE_SHA" --lease-epoch "${{ github.run_attempt }}" --fence-revision "$RELEASE_SHA" --release-evidence "$RUNNER_TEMP/release-evidence.json" --integrated-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --issued-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --target-id "airvio.co/knowgrph" --output-dir "$RUNNER_TEMP/production-lifecycle" --github-output >> "$GITHUB_OUTPUT"
          {
            echo "- Neutral candidate receipt: \`$(jq -r .receiptDigest "$RUNNER_TEMP/production-lifecycle/candidate-manifest.json")\`"
            echo "- Guideline policy: \`${{ steps.guideline_revision.outputs.revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production authorization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'production-authorization-${{ inputs.source_sha }}', path: "${{ runner.temp }}/local-review-candidate.json\n${{ runner.temp }}/release-evidence.json\n${{ runner.temp }}/production-release-candidate.json", if-no-files-found: error, retention-days: 1 }
      - name: Persist pre-authorization lifecycle receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'production-lifecycle-${{ inputs.source_sha }}-${{ github.run_id }}', path: '${{ runner.temp }}/production-lifecycle', if-no-files-found: error, retention-days: 90 }
      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'production-${{ inputs.source_sha }}', path: "huijoohwee/404.html\nhuijoohwee/content/knowgrph\nhuijoohwee/knowgrph\nhuijoohwee/functions\nhuijoohwee/canvas\nhuijoohwee/contracts\nhuijoohwee/grph-shared\nhuijoohwee/_worker.js\nhuijoohwee/_routes.json\nhuijoohwee/_headers\nhuijoohwee/_redirects\nhuijoohwee/.well-known/runtime-readiness.json\nhuijoohwee/.knowgrph-production-artifact-manifest.json", if-no-files-found: error, include-hidden-files: true, retention-days: 1 }
  deploy:
    name: Human-Authorized Deploy, Verify, And Publish Mirror
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env: { CLOUDFLARE_PAGES_PROJECT: '${{ vars.CLOUDFLARE_PAGES_PROJECT }}', KNOWGRPH_AGENTIC_CANVAS_OS_DOCS_ROOT: '${{ github.workspace }}/agentic-canvas-os/docs', RELEASE_SHA: '${{ inputs.source_sha }}', PRODUCTION_CANDIDATE_DIGEST: '${{ needs.verify.outputs.candidate_digest }}', PRODUCTION_LIFECYCLE_CANDIDATE_DIGEST: '${{ needs.verify.outputs.lifecycle_candidate_digest }}' }
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: '${{ inputs.source_sha }}', path: knowgrph, fetch-depth: 1 }
      - name: Checkout production mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: huijoohwee/huijoohwee, ref: '${{ needs.verify.outputs.mirror_revision }}', path: huijoohwee, token: '${{ secrets.HUIJOOHWEE_PUSH_TOKEN }}' }
      - name: Checkout exact Agentic Canvas OS docs SSOT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: '${{ needs.verify.outputs.docs_repository }}', ref: '${{ needs.verify.outputs.docs_revision }}', path: agentic-canvas-os }
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: "knowgrph/package-lock.json\nknowgrph/canvas/package-lock.json" }
      - name: Install dependencies
        working-directory: knowgrph
        run: bash ./scripts/install-production-release-dependencies.sh
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'production-${{ inputs.source_sha }}', path: '${{ runner.temp }}/production-mirror-artifact' }
      - name: Reconcile verified artifact into exact mirror base
        working-directory: knowgrph
        run: npm run --silent production:mirror-artifact:reconcile -- "$RUNNER_TEMP/production-mirror-artifact" "$GITHUB_WORKSPACE/huijoohwee"
      - name: Download immutable manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'immutable-release-manifest-${{ inputs.source_sha }}', path: '${{ runner.temp }}/immutable-release-manifest-proof' }
      - name: Download production authorization evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'production-authorization-${{ inputs.source_sha }}', path: '${{ runner.temp }}/production-authorization' }
      - name: Download neutral lifecycle receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: 'production-lifecycle-${{ inputs.source_sha }}-${{ github.run_id }}', path: '${{ runner.temp }}/production-lifecycle' }
      - name: Record exact human authorization and claim release controller
        working-directory: knowgrph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" > "$RUNNER_TEMP/production-approvals.json"
          npm run --silent release:lifecycle:receipts -- authorize --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os/docs" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --receipt-dir "$RUNNER_TEMP/production-lifecycle" --local-review "$RUNNER_TEMP/production-authorization/local-review-candidate.json" --release-candidate "$RUNNER_TEMP/production-authorization/production-release-candidate.json" --approvals "$RUNNER_TEMP/production-approvals.json" --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" --server-url "${{ github.server_url }}" --controller-id "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:deploy" --candidate-digest "$PRODUCTION_LIFECYCLE_CANDIDATE_DIGEST" --issued-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --output-dir "$RUNNER_TEMP/production-lifecycle"
          {
            echo "## Human-authorized Production release"
            echo "- Candidate: \`$PRODUCTION_LIFECYCLE_CANDIDATE_DIGEST\`"
            echo "- Reviewer: \`$(jq -r .humanActorId "$RUNNER_TEMP/production-lifecycle/human-authorization-receipt.json")\`"
            echo "- Interaction: \`$(jq -r .receiptDigest "$RUNNER_TEMP/production-lifecycle/authorization-interaction-receipt.json")\`"
            echo "- Authorization: \`$(jq -r .receiptDigest "$RUNNER_TEMP/production-lifecycle/human-authorization-receipt.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Revalidate immutable manifest and configuration
        working-directory: knowgrph
        run: |
          test "$(git -C ../agentic-canvas-os rev-parse HEAD)" = "${{ needs.verify.outputs.docs_revision }}"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          test -n "${{ secrets.HUIJOOHWEE_PUSH_TOKEN }}"
          npm run --silent release:manifest:check -- "$RUNNER_TEMP/immutable-release-manifest-proof/immutable-release-manifest.json" --source-sha "$RELEASE_SHA" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --digest "${{ needs.verify.outputs.manifest_digest }}"
          npm run --silent release:candidate:authorization -- verify --candidate "$RUNNER_TEMP/production-authorization/production-release-candidate.json" --local-review "$RUNNER_TEMP/production-authorization/local-review-candidate.json" --readiness "$GITHUB_WORKSPACE/huijoohwee/.well-known/runtime-readiness.json" --source-sha "$RELEASE_SHA" --source-tree "$(git rev-parse HEAD^{tree})" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os" --candidate-digest "$PRODUCTION_CANDIDATE_DIGEST"
      - name: Capture current production rollback target
        id: previous
        working-directory: knowgrph
        env: &cloudflare_release_environment { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          node ./scripts/verify-production-release-transports.mjs pages --mode previous --evidence-dir "$RUNNER_TEMP" --output "$RUNNER_TEMP/previous-pages-observation.json" --github-output
          npm run --silent storage:d1:seed:docs -- --capture-state --evidence-output "$RUNNER_TEMP/previous-d1-state-evidence.json"
          node ./scripts/verify-production-release-transports.mjs recapture-rollback --pages-observation "$RUNNER_TEMP/previous-pages-observation.json" --state-evidence "$RUNNER_TEMP/previous-d1-state-evidence.json" --release-evidence "$RUNNER_TEMP/production-authorization/release-evidence.json" --mirror-revision "${{ needs.verify.outputs.mirror_revision }}" --output "$RUNNER_TEMP/previous-production-rollback-recapture.json" --digest-output "$RUNNER_TEMP/previous-production-rollback-digest.txt"
      - name: Revalidate last-known-good rollback identity
        working-directory: knowgrph
        run: test "$(git -C ../huijoohwee ls-remote origin refs/heads/main | cut -f1)" = "${{ needs.verify.outputs.mirror_revision }}"
      - name: Enforce sole deployment ownership
        working-directory: knowgrph
        env: *cloudflare_release_environment
        run: |
          npm run --silent release:main-authority:check -- --source-sha "$RELEASE_SHA"
          npm run --silent release:candidate:authorization -- verify --candidate "$RUNNER_TEMP/production-authorization/production-release-candidate.json" --local-review "$RUNNER_TEMP/production-authorization/local-review-candidate.json" --readiness "$GITHUB_WORKSPACE/huijoohwee/.well-known/runtime-readiness.json" --source-sha "$RELEASE_SHA" --source-tree "$(git rev-parse HEAD^{tree})" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os" --candidate-digest "$PRODUCTION_CANDIDATE_DIGEST"
          npm run --silent runtime:pages:owner-enforce
      - name: Preflight protected travel mesh without mutation
        id: travel_mesh_preflight
        working-directory: knowgrph
        env: &travel_mesh_environment {
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}', KNOWGRPH_AGENT_RUNTIME_BEARER_TOKEN: '${{ secrets.KNOWGRPH_AGENT_RUNTIME_BEARER_TOKEN }}', KNOWGRPH_MCP_TOOL_LIST_NAME: '${{ vars.KNOWGRPH_MCP_TOOL_LIST_NAME }}', KNOWGRPH_MEDIA_BUCKET: '${{ vars.KNOWGRPH_MEDIA_BUCKET }}', KNOWGRPH_MEDIA_R2_BUCKET: '${{ vars.KNOWGRPH_MEDIA_R2_BUCKET }}', KNOWGRPH_STORAGE_SIGNING_SECRET: '${{ secrets.KNOWGRPH_STORAGE_SIGNING_SECRET }}', SHARED_NODE_TRAVEL_BUNDLE_MAP_JSON: '${{ secrets.SHARED_NODE_TRAVEL_BUNDLE_MAP_JSON }}',
          TRAVEL_ACCESS_AUDIENCE: '${{ vars.TRAVEL_ACCESS_AUDIENCE }}', TRAVEL_ACCESS_CLIENT_ID: '${{ secrets.TRAVEL_ACCESS_CLIENT_ID }}', TRAVEL_ACCESS_CLIENT_SECRET: '${{ secrets.TRAVEL_ACCESS_CLIENT_SECRET }}', TRAVEL_ACCESS_ISSUER: '${{ vars.TRAVEL_ACCESS_ISSUER }}', TRAVEL_AGENT_DEFINITION_CACHE_KV_NAMESPACE_ID: '${{ vars.TRAVEL_AGENT_DEFINITION_CACHE_KV_NAMESPACE_ID }}', TRAVEL_ATLAS_API_BASE_URL: '${{ secrets.TRAVEL_ATLAS_API_BASE_URL }}', TRAVEL_ATLAS_CLIENT_ID: '${{ secrets.TRAVEL_ATLAS_CLIENT_ID }}', TRAVEL_ATLAS_CLIENT_SECRET: '${{ secrets.TRAVEL_ATLAS_CLIENT_SECRET }}', TRAVEL_ATLAS_ROUTE_CATALOGUE_JSON: '${{ secrets.TRAVEL_ATLAS_ROUTE_CATALOGUE_JSON }}', TRAVEL_ATLAS_SEARCH_PATH: '${{ secrets.TRAVEL_ATLAS_SEARCH_PATH }}', TRAVEL_ATLAS_VERIFY_PATH: '${{ secrets.TRAVEL_ATLAS_VERIFY_PATH }}',
          TRAVEL_BALANCE_CACHE_KV_NAMESPACE_ID: '${{ vars.TRAVEL_BALANCE_CACHE_KV_NAMESPACE_ID }}', TRAVEL_COMMERCE_API_TOKEN: '${{ secrets.TRAVEL_COMMERCE_API_TOKEN }}', TRAVEL_COMMERCE_SERVICE: '${{ vars.TRAVEL_COMMERCE_SERVICE }}', TRAVEL_EXPERIENCE_DISCOVERY_SERVICE: '${{ vars.TRAVEL_EXPERIENCE_DISCOVERY_SERVICE }}', TRAVEL_EXPERIENCE_PROVIDER_API_TOKEN: '${{ secrets.TRAVEL_EXPERIENCE_PROVIDER_API_TOKEN }}', TRAVEL_EXPERIENCE_PROVIDER_BASE_URL: '${{ vars.TRAVEL_EXPERIENCE_PROVIDER_BASE_URL }}', TRAVEL_EXPERIENCE_PROVIDER_ID: '${{ vars.TRAVEL_EXPERIENCE_PROVIDER_ID }}', TRAVEL_EXPERIENCE_PROVIDER_SEARCH_PATH: '${{ vars.TRAVEL_EXPERIENCE_PROVIDER_SEARCH_PATH }}', TRAVEL_EXPERIENCE_PROVIDER_VERIFY_PATH: '${{ vars.TRAVEL_EXPERIENCE_PROVIDER_VERIFY_PATH }}', TRAVEL_EXPERIENCE_ROUTE_CATALOGUE_JSON: '${{ vars.TRAVEL_EXPERIENCE_ROUTE_CATALOGUE_JSON }}',
          TRAVEL_FLIGHT_DISCOVERY_SERVICE: '${{ vars.TRAVEL_FLIGHT_DISCOVERY_SERVICE }}', TRAVEL_INFERENCE_OVERFLOW_TOKEN: '${{ secrets.TRAVEL_INFERENCE_OVERFLOW_TOKEN }}', TRAVEL_ISSUANCE_SERVICE_AUTH_TOKEN: '${{ secrets.TRAVEL_ISSUANCE_SERVICE_AUTH_TOKEN }}', TRAVEL_ISSUANCE_SERVICE_BASE_URL: '${{ vars.TRAVEL_ISSUANCE_SERVICE_BASE_URL }}', TRAVEL_MCP_SERVICE: '${{ vars.TRAVEL_MCP_SERVICE }}', TRAVEL_MESH_BOOTSTRAP_RECEIPT_JSON: '${{ vars.TRAVEL_MESH_BOOTSTRAP_RECEIPT_JSON }}', TRAVEL_MESH_PROBE_SPEC_JSON: '${{ vars.TRAVEL_MESH_PROBE_SPEC_JSON }}', TRAVEL_NET_SETTLEMENT_SERVICE: '${{ vars.TRAVEL_NET_SETTLEMENT_SERVICE }}', TRAVEL_OPERATOR_GATEWAY_SERVICE: '${{ vars.TRAVEL_OPERATOR_GATEWAY_SERVICE }}', TRAVEL_OVERFLOW_CONTAINER_IMAGE: '${{ vars.TRAVEL_OVERFLOW_CONTAINER_IMAGE }}', TRAVEL_OVERFLOW_SERVICE: '${{ vars.TRAVEL_OVERFLOW_SERVICE }}',
