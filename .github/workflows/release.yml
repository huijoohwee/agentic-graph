      - name: Restore exact prior travel mesh versions
        id: rollback_travel_mesh
        if: always() && failure() && steps.deploy_travel_mesh.outputs.receipt_sealed == 'true' && steps.deploy_travel_mesh.outputs.mutation_proven == 'true' && steps.deploy_travel_mesh.outputs.preserve_required != 'true' && steps.deploy_travel_mesh.outputs.compensated != 'true' && steps.publish_mirror.outputs.publication_attempted != 'true' && steps.publish_mirror.outputs.publication_committed != 'true'
        working-directory: knowgrph
        env: *travel_mesh_environment
        run: |
          npm run --silent release:main-authority:check -- --source-sha "$RELEASE_SHA"
          npm run --silent release:candidate:authorization -- verify --candidate "$RUNNER_TEMP/production-authorization/production-release-candidate.json" --local-review "$RUNNER_TEMP/production-authorization/local-review-candidate.json" --readiness "$GITHUB_WORKSPACE/huijoohwee/.well-known/runtime-readiness.json" --source-sha "$RELEASE_SHA" --source-tree "$(git rev-parse HEAD^{tree})" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os" --candidate-digest "$PRODUCTION_CANDIDATE_DIGEST"
          node ./scripts/travel-mesh-release.mjs rollback --source-sha "$RELEASE_SHA" --candidate-digest "$PRODUCTION_LIFECYCLE_CANDIDATE_DIGEST" --authorization "$RUNNER_TEMP/production-lifecycle/consumed-human-authorization-receipt.json" --receipt "$RUNNER_TEMP/travel-mesh-release-receipt.json" --output "$RUNNER_TEMP/travel-mesh-rollback-receipt.json" --github-output
      - name: Checkout rollback Knowgrph source
        id: checkout_rollback_source
        if: always() && steps.rollback_eligibility.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: '${{ fromJSON(inputs.release_evidence).rollbackIdentity.pages.sourceRevision }}', path: rollback-knowgrph }
      - name: Install rollback dependencies
        if: always() && steps.checkout_rollback_source.outcome == 'success'
        id: install_rollback_dependencies
        working-directory: rollback-knowgrph
        run: npm ci
      - name: Resolve rollback docs dependency
        if: always() && steps.install_rollback_dependencies.outcome == 'success'
        id: rollback_docs
        working-directory: rollback-knowgrph
        run: npm run --silent runtime:docs-dependency:resolve -- --github-output >> "$GITHUB_OUTPUT"
      - name: Checkout rollback Agentic Canvas OS docs
        if: always() && steps.rollback_docs.outcome == 'success'
        id: checkout_rollback_docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: '${{ steps.rollback_docs.outputs.repository }}', ref: '${{ steps.rollback_docs.outputs.ref }}', path: rollback-agentic-canvas-os }
      - name: Roll back Pages to exact last-known-good deployment
        id: rollback_pages
        if: always() && steps.checkout_rollback_docs.outcome == 'success'
        working-directory: knowgrph
        env: *cloudflare_release_environment
        run: npm run --silent runtime:pages:rollback -- --deployment-id "${{ steps.previous.outputs.deployment_id }}"
      - name: Restore and reconcile last-known-good D1 state
        id: rollback_state
        if: always() && steps.rollback_pages.outcome == 'success'
        working-directory: knowgrph
        env: *cloudflare_release_environment
        run: |
          failed_stage="$(jq -er .failedStage "$RUNNER_TEMP/release-failure-observation.json")"
          if test "$failed_stage" = deployment; then
            npm run --silent storage:d1:seed:docs -- --capture-state --evidence-output "$RUNNER_TEMP/restored-d1-state-evidence.json"
          else
            npm run --silent storage:d1:seed:docs -- --docs-root "$GITHUB_WORKSPACE/rollback-agentic-canvas-os/docs" --evidence-output "$RUNNER_TEMP/restored-d1-state-evidence.json"
          fi
      - name: Capture authoritative restored Pages deployment
        id: restored_pages
        if: always() && steps.rollback_state.outcome == 'success'
        working-directory: knowgrph
        env: *cloudflare_release_environment
        run: |
          node ./scripts/verify-production-release-transports.mjs pages --mode restored --evidence-dir "$RUNNER_TEMP" --release-evidence "$RUNNER_TEMP/production-authorization/release-evidence.json" --output "$RUNNER_TEMP/restored-pages-evidence.json" --github-output
      - name: Verify restored immutable Pages runtime
        id: restored_immutable_smoke
        if: always() && steps.restored_pages.outcome == 'success'
        working-directory: rollback-knowgrph
        env:
          KNOWGRPH_AGENT_READY_BASE_URL: ${{ steps.restored_pages.outputs.deployment_url }}
        run: |
          set -o pipefail
          ./.github/workflows/smoke-test.sh | tee "$RUNNER_TEMP/restored-immutable-origin-smoke.log"
      - name: Verify restored stable Pages runtime
        id: restored_stable_smoke
        if: always() && steps.restored_pages.outcome == 'success'
        working-directory: rollback-knowgrph
        env:
          KNOWGRPH_AGENT_READY_BASE_URL: https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev
        run: |
          set -o pipefail
          ./.github/workflows/smoke-test.sh | tee "$RUNNER_TEMP/restored-stable-pages-smoke.log"
      - name: Verify restored public custom-domain runtime
        id: restored_public_smoke
        if: always() && steps.restored_pages.outcome == 'success'
        working-directory: rollback-knowgrph
        env:
          KNOWGRPH_AGENT_READY_BASE_URL: https://airvio.co
        run: |
          set -o pipefail
          ./.github/workflows/smoke-test.sh | tee "$RUNNER_TEMP/restored-public-route-smoke.log"
      - name: Record restored production transport evidence
        id: restored_transports
        if: always() && steps.restored_immutable_smoke.outcome == 'success' && steps.restored_stable_smoke.outcome == 'success' && steps.restored_public_smoke.outcome == 'success'
        working-directory: knowgrph
        run: |
          node ./scripts/verify-production-release-transports.mjs --immutable-origin "${{ steps.restored_pages.outputs.deployment_url }}" --stable-pages-origin "https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev" --public-origin "https://airvio.co" --source-sha "${{ steps.restored_pages.outputs.source_revision }}" --manifest-digest "${{ steps.restored_pages.outputs.manifest_digest }}" --immutable-smoke "$RUNNER_TEMP/restored-immutable-origin-smoke.log" --stable-pages-smoke "$RUNNER_TEMP/restored-stable-pages-smoke.log" --public-smoke "$RUNNER_TEMP/restored-public-route-smoke.log" --output "$RUNNER_TEMP/restored-transport-evidence.json"
      - name: Seal and validate rolled-back lifecycle carrier
        id: rollback_terminal
        if: >-
          always() && steps.restored_transports.outcome == 'success' &&
          ((steps.deploy_travel_mesh.outputs.receipt_sealed == 'true' && steps.deploy_travel_mesh.outputs.mutation_proven == 'true' && steps.deploy_travel_mesh.outputs.compensated != 'true' && steps.rollback_travel_mesh.outcome == 'success') ||
          (steps.deploy_travel_mesh.outcome == 'failure' && steps.deploy_travel_mesh.outputs.receipt_sealed == 'true' && steps.deploy_travel_mesh.outputs.preserve_required != 'true' &&
          (steps.deploy_travel_mesh.outputs.mutation_possible != 'true' || steps.deploy_travel_mesh.outputs.compensated == 'true')) ||
          steps.deploy_travel_mesh.outcome == 'skipped')
        working-directory: knowgrph
        run: |
          rolled_back_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          npm run --silent release:lifecycle:receipts -- rollback --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os/docs" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --receipt-dir "$RUNNER_TEMP/production-lifecycle" --failure-observation "$RUNNER_TEMP/release-failure-observation.json" --restored-pages "$RUNNER_TEMP/restored-pages-evidence.json" --restored-state "$RUNNER_TEMP/restored-d1-state-evidence.json" --restored-transports "$RUNNER_TEMP/restored-transport-evidence.json" --observed-mirror "$RUNNER_TEMP/observed-mirror-identity.json" --issued-at "$rolled_back_at" --output-dir "$RUNNER_TEMP/production-lifecycle"
          npm run --silent release:lifecycle:receipts -- carrier --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os/docs" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --receipt-dir "$RUNNER_TEMP/production-lifecycle" --completion rolled-back --output "$RUNNER_TEMP/production-lifecycle/collaborative-release-lifecycle-rollback-v2.json"
          npm run --silent release:lifecycle:receipts -- validate --docs-root "$GITHUB_WORKSPACE/agentic-canvas-os/docs" --docs-sha "${{ needs.verify.outputs.docs_revision }}" --carrier "$RUNNER_TEMP/production-lifecycle/collaborative-release-lifecycle-rollback-v2.json"
          {
            echo "- Rollback: \`$(jq -r .receiptDigest "$RUNNER_TEMP/production-lifecycle/rollback-receipt.json")\`"
            echo "- Rolled-back carrier file digest: \`$(sha256sum "$RUNNER_TEMP/production-lifecycle/collaborative-release-lifecycle-rollback-v2.json" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist terminal rolled-back lifecycle receipts
        if: always() && steps.rollback_terminal.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'production-lifecycle-rolled-back-${{ inputs.source_sha }}-${{ github.run_id }}', path: '${{ runner.temp }}/production-lifecycle', if-no-files-found: error, retention-days: 90 }
      - name: Persist raw production release observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'production-release-raw-${{ inputs.source_sha }}-${{ github.run_id }}', path: "${{ runner.temp }}/release-stage.txt\n${{ runner.temp }}/*failure*.json\n${{ runner.temp }}/*pages*.json\n${{ runner.temp }}/*d1*.json\n${{ runner.temp }}/*travel-mesh*.json\n${{ runner.temp }}/*rollback*\n${{ runner.temp }}/*smoke.log\n${{ runner.temp }}/*evidence.json\n${{ runner.temp }}/*deploy*.log\n${{ runner.temp }}/wrangler*.ndjson\n${{ runner.temp }}/production-lifecycle", if-no-files-found: warn, retention-days: 90 }
