name: Promote Agentic Canvas OS Docs
# runtime-docs-workflow: promoter

on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: promote-agentic-canvas-os-docs
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Protected Docs Revision
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout AgenticGraph main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: agenticgraph
          token: ${{ secrets.HUIJOOHWEE_PUSH_TOKEN }}

      - name: Detect pending docs revision
        id: pending
        working-directory: agenticgraph
        shell: bash
        run: |
          repository="$(sed -nE '/^docs_dependency:/,/^[^ ]/ s/^  repository: "(https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\.git)"$/\1/p' docs/runtime-readiness-contract.md)"
          current_revision="$(sed -nE '/^docs_dependency:/,/^[^ ]/ s/^  ref: "([0-9a-f]{40})"$/\1/p' docs/runtime-readiness-contract.md)"
          if [[ ! "$repository" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$ || ! "$current_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "docs_dependency must contain one exact GitHub repository and immutable ref" >&2
            exit 1
          fi
          latest_revision="$(git ls-remote "$repository" refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')"
          if [[ ! "$latest_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve one exact protected main revision" >&2
            exit 1
          fi
          echo "revision=$latest_revision" >> "$GITHUB_OUTPUT"
          if [[ "$current_revision" == "$latest_revision" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.pending.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.pending.outputs.changed == 'true'
        working-directory: agenticgraph
        run: npm ci --no-audit --no-fund

      - name: Resolve latest protected docs revision
        if: steps.pending.outputs.changed == 'true'
        id: promotion
        working-directory: agenticgraph
        run: node ./scripts/promote-agentic-canvas-os-revision.mjs
        env:
          GH_TOKEN: ${{ secrets.HUIJOOHWEE_PUSH_TOKEN }}

      - name: Checkout exact Agentic Canvas OS revision
        if: steps.promotion.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/agentic-canvas-os
          ref: ${{ steps.promotion.outputs.revision }}
          path: agentic-canvas-os
          fetch-depth: 0

      - name: Validate exact docs source
        if: steps.promotion.outputs.changed == 'true'
        working-directory: agenticgraph
        run: |
          test "$(git -C ../agentic-canvas-os rev-parse HEAD)" = "${{ steps.promotion.outputs.revision }}"
          npm --prefix ../agentic-canvas-os run docs:check
          node --test scripts/__tests__/runtime-readiness-contract.test.mjs scripts/__tests__/promote-agentic-canvas-os-revision.test.mjs
        env:
          AGENTICGRAPH_AGENTIC_CANVAS_OS_DOCS_ROOT: ${{ github.workspace }}/agentic-canvas-os/docs

      - name: Open protected promotion pull request
        if: steps.promotion.outputs.changed == 'true'
        working-directory: agenticgraph
        env:
          DOCS_REVISION: ${{ steps.promotion.outputs.revision }}
          GH_TOKEN: ${{ secrets.HUIJOOHWEE_PUSH_TOKEN }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          branch="agent/automation/agentic-canvas-os-${DOCS_REVISION:0:12}-${base_sha:0:12}"
          git config user.name "agenticgraph-lifecycle[bot]"
          git config user.email "agenticgraph-lifecycle[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            url="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
            if [[ -z "$url" ]]; then
              echo "promotion branch exists without one open pull request: $branch" >&2
              exit 1
            fi
            gh pr edit "$url" --add-label automerge
            gh pr ready "$url" || true
            gh pr merge "$url" --auto --squash
            exit 0
          fi
          git switch -c "$branch"
          git add docs/runtime-readiness-contract.md
          git commit -m "Promote Agentic Canvas OS ${DOCS_REVISION:0:12}"
          git push --set-upstream origin "$branch"
          body=$'---\naction: /change\nscope: "#runtime.readiness"\nactor: "@agentic-docs-promoter"\nbase_sha: "'"$base_sha"$'"\n---\n\nAutomatically promotes the latest protected, green Agentic Canvas OS docs revision.\n'
          url="$(gh pr create --draft --base main --head "$branch" --title "Promote Agentic Canvas OS ${DOCS_REVISION:0:12}" --body "$body")"
          gh pr edit "$url" --add-label automerge
          gh pr ready "$url"
          gh pr merge "$url" --auto --squash
