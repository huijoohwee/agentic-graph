name: ADLC authority

run-name: ADLC authority ${{ inputs.authority_input_digest }} @ ${{ github.workflow_sha }}

on:
  workflow_dispatch:
    inputs:
      authority_payload:
        description: Exact canonical request and recovery candidate JSON.
        required: true
        type: string
      authority_input_digest:
        description: SHA-256 of the exact authority input and committed policy.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: huijoohwee/agentic-graph
          ref: ${{ github.sha }}
          path: agentic-graph
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: huijoohwee/agentic-os
          ref: e1cf2c794ca8b8863cce20c267fbeae4639d2117
          path: agentic-os
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Bind enrollment to the exact Graph repository and current main
        working-directory: agentic-graph
        run: |
          test "$GITHUB_REPOSITORY" = "huijoohwee/agentic-graph"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import { loadAuthorityDispatch } from "../agentic-os/bin/agentic-os-authority.mjs";
          const { dispatch } = loadAuthorityDispatch(process.env.GITHUB_EVENT_PATH);
          const target = "github.com/huijoohwee/agentic-graph";
          if (dispatch.request.repository !== target || dispatch.candidate.targetRepository !== target)
            throw new Error("authority target is outside this enrollment");
          NODE
      - name: Validate exact authority input without publication credentials
        working-directory: agentic-graph
        run: node ../agentic-os/bin/agentic-os-authority.mjs validate-event --event="$GITHUB_EVENT_PATH" --policy=.github/adlc-authority-policy.json
