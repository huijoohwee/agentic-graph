name: Integration
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Protected head refresh {0} {1}', inputs.operation_id, inputs.expected_head_sha) || 'Integration' }}

on:
  workflow_dispatch:
    inputs:
      operation: { description: Exact trusted controller operation, required: true, type: string }
      pull_request_number: { description: Exact pull request number, required: true, type: number }
      branch: { description: Exact protected refresh branch, required: true, type: string }
      expected_head_sha: { description: Exact protected refresh candidate, required: true, type: string }
      operation_id: { description: Exact protected refresh operation digest, required: true, type: string }
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      AGENTIC_OS_PR_BODY: ${{ github.event.pull_request.body || '' }}
      AGENTIC_OS_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
      AGENTIC_OS_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
      AGENTIC_OS_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch || '' }}
      AGENTIC_OS_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number || '' }}
      AGENTIC_OS_REPOSITORY: ${{ github.repository }}
      AGENTIC_OS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
      AGENTIC_OS_TARGET_REF: ${{ github.event_name == 'merge_group' && 'refs/heads/main' || format('refs/heads/{0}', github.event.pull_request.head.ref || inputs.branch || github.ref_name) }}
      AGENTIC_OS_AGENTIC_CANVAS_OS_DOCS_ROOT: ${{ github.workspace }}/agentic-canvas-os/docs

    steps:
      - name: Checkout agentic-graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: agentic-graph
          fetch-depth: 0

      - name: Authorize exact protected refresh dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: agentic-graph
        env:
          EXPECTED_OPERATION: ${{ inputs.operation }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$EXPECTED_OPERATION" = "protected-head-refresh"
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Load exact protected refresh pull request metadata
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { randomUUID } from 'node:crypto'

          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.EXPECTED_PR_NUMBER}`,
            { headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28',
            } },
          )
          if (!response.ok) throw new Error(`pull request metadata returned ${response.status}`)
          const pullRequest = await response.json()
          if (String(pullRequest.number) !== process.env.EXPECTED_PR_NUMBER
            || pullRequest.base?.ref !== 'main'
            || pullRequest.head?.ref !== process.env.EXPECTED_BRANCH
            || pullRequest.head?.sha !== process.env.EXPECTED_HEAD_SHA
            || pullRequest.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY
            || pullRequest.draft === true) {
            throw new Error('protected refresh pull request metadata drifted')
          }
          const delimiter = `AG_PR_BODY_${randomUUID().replaceAll('-', '')}`
          const body = String(pullRequest.body || '')
          if (body.includes(delimiter)) throw new Error('pull request body delimiter collision')
          appendFileSync(process.env.GITHUB_ENV, [
            `AGENTIC_OS_PR_BODY<<${delimiter}`,
            body,
            delimiter,
            'AGENTIC_OS_PR_BASE_REF=main',
            'AGENTIC_OS_PR_DRAFT=false',
            `AGENTIC_OS_PR_HEAD_REF=${pullRequest.head.ref}`,
            '',
          ].join('\n'))
          NODE

      - name: Checkout publish mirror for drift verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/huijoohwee
          ref: main
          path: huijoohwee

      - name: Checkout schema mirror for drift verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/huijoohwee.github.io
          ref: main
          path: huijoohwee.github.io

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agentic-graph/package-lock.json
            agentic-graph/canvas/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agentic-graph
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_TERMINAL_PROMPT: '0'
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after $attempt attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Install Playwright Chromium
        working-directory: agentic-graph
        run: npx playwright install --with-deps chromium

      - name: Resolve Agentic Canvas OS docs dependency
        id: agentic_canvas_os_docs
        working-directory: agentic-graph
        run: npm run --silent runtime:docs-dependency:resolve -- --github-output >> "$GITHUB_OUTPUT"

      - name: Checkout Agentic Canvas OS docs SSOT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.agentic_canvas_os_docs.outputs.repository }}
          ref: ${{ steps.agentic_canvas_os_docs.outputs.ref }}
          path: agentic-canvas-os
          fetch-depth: 0

      - name: Create immutable app docs catalog manifest
        id: immutable_manifest
        working-directory: agentic-graph
        run: npm run --silent release:manifest:create -- --source-sha "$AGENTIC_OS_SOURCE_REVISION" --target-ref "$AGENTIC_OS_TARGET_REF" --output "$RUNNER_TEMP/immutable-release-manifest.json" --github-output

      - name: Validate checked-out Agentic Canvas OS revision
        working-directory: agentic-graph
        run: test "$(git -C ../agentic-canvas-os rev-parse HEAD)" = "${{ steps.agentic_canvas_os_docs.outputs.ref }}"

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: immutable-release-manifest
          path: ${{ runner.temp }}/immutable-release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Download immutable release manifest proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: immutable-release-manifest
          path: ${{ runner.temp }}/immutable-release-manifest-proof

      - name: Validate immutable release manifest proof
        working-directory: agentic-graph
        run: npm run --silent release:manifest:check -- "$RUNNER_TEMP/immutable-release-manifest-proof/immutable-release-manifest.json" --source-sha "$AGENTIC_OS_SOURCE_REVISION" --docs-sha "${{ steps.agentic_canvas_os_docs.outputs.ref }}" --digest "${{ steps.immutable_manifest.outputs.digest }}"

      - name: Validate cross-device scope ownership
        working-directory: agentic-graph
        env:
          AGENTIC_OS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTIC_OS_REQUIRE_REMOTE_SCOPE_CHECK: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: npm run --silent collaboration:contract:check -- --json > collaboration-contract-report.json

      - name: Upload collaboration contract report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collaboration-contract-report
          path: agentic-graph/collaboration-contract-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Download collaboration contract report proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: collaboration-contract-report
          path: agentic-graph/collaboration-contract-report-proof

      - name: Validate downloaded collaboration contract report
        working-directory: agentic-graph
        run: npm run --silent collaboration:report:check -- --json collaboration-contract-report-proof/collaboration-contract-report.json > collaboration-validation-result.json

      - name: Upload collaboration validation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collaboration-validation-result
          path: agentic-graph/collaboration-validation-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Download collaboration validation result proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: collaboration-validation-result
          path: agentic-graph/collaboration-validation-result-proof

      - name: Validate downloaded collaboration validation result
        working-directory: agentic-graph
        run: npm run --silent collaboration:report:check-result -- collaboration-validation-result-proof/collaboration-validation-result.json --report collaboration-contract-report-proof/collaboration-contract-report.json --source-revision "$AGENTIC_OS_SOURCE_REVISION"

      - name: Run canonical integration gate
        working-directory: agentic-graph
        env:
          AGENTIC_OS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ci:integration

      - name: Run XR v2 runtime review-candidate gate
        working-directory: agentic-graph
        env:
          AG_XR_V2_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: npm run xr-v2:unit && npm run xr-v2:source-ready && npm -C canvas run test:smoke:xr-v2:browser && node canvas/scripts/run_xr_v2_browser_smoke.mjs

      - name: Upload XR v2 browser observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xr-v2-browser-observation
          path: agentic-graph/data/outputs/xr-v2-browser-smoke.json
          if-no-files-found: error
          retention-days: 7
