name: Integration
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'protected-main-recheck' && format('Protected main recheck {0} {1}', inputs.operation_id, inputs.expected_head_sha) || format('Protected head refresh {0} {1}', inputs.operation_id, inputs.expected_head_sha)) || 'Integration' }}

on:
  workflow_dispatch:
    inputs:
      operation: { description: Exact trusted controller operation, required: true, type: string }
      pull_request_number: { description: Exact pull request number (zero for main recheck), required: false, default: 0, type: number }
      branch: { description: Exact protected refresh branch, required: true, type: string }
      expected_head_sha: { description: Exact protected refresh candidate, required: true, type: string }
      operation_id: { description: Exact protected refresh operation digest, required: true, type: string }
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      AGENTIC_OS_PR_BODY: ${{ github.event.pull_request.body || '' }}
      AGENTIC_OS_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
      AGENTIC_OS_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
      AGENTIC_OS_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.branch || '' }}
      AGENTIC_OS_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number || '' }}
      AGENTIC_OS_REPOSITORY: ${{ github.repository }}
      AGENTIC_OS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
      AGENTIC_OS_TARGET_REF: ${{ github.event_name == 'merge_group' && 'refs/heads/main' || format('refs/heads/{0}', github.event.pull_request.head.ref || inputs.branch || github.ref_name) }}
      AGENTIC_OS_AGENTIC_CANVAS_OS_DOCS_ROOT: ${{ github.workspace }}/agentic-os/catalog/dictionaries

    steps:
      - name: Checkout agentic-graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: agentic-graph
          fetch-depth: 0

      - name: Authorize exact protected integration dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: agentic-graph
        env:
          EXPECTED_OPERATION: ${{ inputs.operation }}
          EXPECTED_PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          case "$EXPECTED_OPERATION" in
            protected-head-refresh)
              test "$EXPECTED_PR_NUMBER" -gt 0
              ;;
            protected-main-recheck)
              test "$EXPECTED_BRANCH" = "main"
              test "$EXPECTED_PR_NUMBER" = "0"
              test "$(git ls-remote --exit-code origin refs/heads/main)" = "$EXPECTED_HEAD_SHA"$'\trefs/heads/main'
              ;;
            *) exit 1 ;;
          esac

      - name: Load exact protected refresh pull request metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'protected-head-refresh' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { randomUUID } from 'node:crypto'

          const response = await fetch(
            `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.EXPECTED_PR_NUMBER}`,
            { headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28',
            } },
          )
          if (!response.ok) throw new Error(`pull request metadata returned ${response.status}`)
          const pullRequest = await response.json()
          if (String(pullRequest.number) !== process.env.EXPECTED_PR_NUMBER
            || pullRequest.base?.ref !== 'main'
            || pullRequest.head?.ref !== process.env.EXPECTED_BRANCH
            || pullRequest.head?.sha !== process.env.EXPECTED_HEAD_SHA
            || pullRequest.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY
            || pullRequest.draft === true) {
            throw new Error('protected refresh pull request metadata drifted')
          }
          const delimiter = `AG_PR_BODY_${randomUUID().replaceAll('-', '')}`
          const body = String(pullRequest.body || '')
          if (body.includes(delimiter)) throw new Error('pull request body delimiter collision')
          appendFileSync(process.env.GITHUB_ENV, [
            `AGENTIC_OS_PR_BODY<<${delimiter}`,
            body,
            delimiter,
            'AGENTIC_OS_PR_BASE_REF=main',
            'AGENTIC_OS_PR_DRAFT=false',
            `AGENTIC_OS_PR_HEAD_REF=${pullRequest.head.ref}`,
            '',
          ].join('\n'))
          NODE

      - name: Checkout publish mirror for drift verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/huijoohwee
          ref: main
          path: huijoohwee

      - name: Checkout schema mirror for drift verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: huijoohwee/huijoohwee.github.io
          ref: main
          path: huijoohwee.github.io

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agentic-graph/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agentic-graph
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_TERMINAL_PROMPT: '0'
        # Fail once with the original cause; unchanged reruns repeat lifecycle scripts.
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: agentic-graph
        run: npx playwright install --with-deps chromium

      - name: Resolve Agentic Canvas OS docs dependency
        id: agentic_canvas_os_docs
        working-directory: agentic-graph
        run: npm run --silent runtime:docs-dependency:resolve -- --github-output >> "$GITHUB_OUTPUT"

      - name: Checkout Agentic Canvas OS docs SSOT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.agentic_canvas_os_docs.outputs.repository }}
          ref: ${{ steps.agentic_canvas_os_docs.outputs.ref }}
          path: agentic-os
          fetch-depth: 0

      - name: Create immutable app docs catalog manifest
        id: immutable_manifest
        working-directory: agentic-graph
        run: npm run --silent release:manifest:create -- --source-sha "$AGENTIC_OS_SOURCE_REVISION" --target-ref "$AGENTIC_OS_TARGET_REF" --output "$RUNNER_TEMP/immutable-release-manifest.json" --github-output

      - name: Validate checked-out Agentic Canvas OS revision
        working-directory: agentic-graph
        run: test "$(git -C ../agentic-os rev-parse HEAD)" = "${{ steps.agentic_canvas_os_docs.outputs.ref }}"

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: immutable-release-manifest
          path: ${{ runner.temp }}/immutable-release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Download immutable release manifest proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: immutable-release-manifest
          path: ${{ runner.temp }}/immutable-release-manifest-proof

      - name: Validate immutable release manifest proof
        working-directory: agentic-graph
        run: npm run --silent release:manifest:check -- "$RUNNER_TEMP/immutable-release-manifest-proof/immutable-release-manifest.json" --source-sha "$AGENTIC_OS_SOURCE_REVISION" --docs-sha "${{ steps.agentic_canvas_os_docs.outputs.ref }}" --digest "${{ steps.immutable_manifest.outputs.digest }}"

      - name: Validate cross-device scope ownership
        working-directory: agentic-graph
        env:
          AGENTIC_OS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTIC_OS_REQUIRE_REMOTE_SCOPE_CHECK: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: npm run --silent collaboration:contract:check -- --json > collaboration-contract-report.json

      - name: Upload collaboration contract report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collaboration-contract-report
          path: agentic-graph/collaboration-contract-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Download collaboration contract report proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: collaboration-contract-report
          path: agentic-graph/collaboration-contract-report-proof

      - name: Validate downloaded collaboration contract report
        working-directory: agentic-graph
        run: npm run --silent collaboration:report:check -- --json collaboration-contract-report-proof/collaboration-contract-report.json > collaboration-validation-result.json

      - name: Upload collaboration validation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collaboration-validation-result
          path: agentic-graph/collaboration-validation-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Download collaboration validation result proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: collaboration-validation-result
          path: agentic-graph/collaboration-validation-result-proof

      - name: Validate downloaded collaboration validation result
        working-directory: agentic-graph
        run: npm run --silent collaboration:report:check-result -- collaboration-validation-result-proof/collaboration-validation-result.json --report collaboration-contract-report-proof/collaboration-contract-report.json --source-revision "$AGENTIC_OS_SOURCE_REVISION"

      - name: Capture protected CI source inputs
        id: ci_evidence_capture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: agentic-graph
        run: |
          owner_inputs="$(node scripts/ci-evidence-inputs.mjs)"
          export "$owner_inputs"
          node node_modules/agentic-os/bin/agentic-os-ci-evidence.mjs capture --policy=.agentic-os-ci-evidence.json --output="$RUNNER_TEMP/ci-evidence-before.json"

      - name: Find prior PR source-plan evidence
        id: source_evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./agentic-graph/.github/actions/protected-ci-evidence
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          policy: .agentic-os-ci-source-evidence.json
          defer-verification: 'true'

      - name: Capture source-plan inputs
        id: source_inputs
        if: github.event_name == 'pull_request'
        working-directory: agentic-graph
        run: |
          owner_inputs="$(node scripts/ci-evidence-inputs.mjs)"
          export "$owner_inputs"
          node node_modules/agentic-os/bin/agentic-os-ci-evidence.mjs capture --policy=.agentic-os-ci-source-evidence.json --output="$RUNNER_TEMP/source-before.json"

      - name: Run canonical integration gate
        id: integration
        working-directory: agentic-graph
        env:
          AGENTIC_OS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTIC_OS_CI_SOURCE_EVIDENCE_DIR: ${{ runner.temp }}
        run: npm run ci:integration

      - name: Retain source-plan reuse decision
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-source-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-source-reuse.json
          if-no-files-found: warn
          retention-days: 7

      - name: Export native validation observation
        id: validation_observation
        if: ${{ always() && steps.integration.outcome != '' }}
        continue-on-error: true
        working-directory: agentic-graph
        run: node node_modules/agentic-os/bin/agentic-os-validation.mjs observe --root=. --input="$(git rev-parse --git-path agentic-os-tests/validation-last.json)" > "$RUNNER_TEMP/validation-observation.json"

      - name: Retain native validation observation
        if: ${{ always() && steps.validation_observation.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-observation.json
          if-no-files-found: error
          retention-days: 7

      - name: Select XR runtime gate from native source inputs
        id: xr_gate
        working-directory: agentic-graph
        run: node scripts/ci-evidence-inputs.mjs --xr-gate >> "$GITHUB_OUTPUT"

      - name: Run XR v2 runtime review-candidate gate
        if: steps.xr_gate.outputs.required != 'false'
        working-directory: agentic-graph
        run: npm run xr-v2:unit && npm run xr-v2:source-ready && npm -C canvas run test:smoke:xr-v2:browser

      - name: Upload XR v2 browser observation
        if: steps.xr_gate.outputs.required != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xr-v2-browser-observation
          path: agentic-graph/data/outputs/xr-v2-browser-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Seal protected CI source evidence
        id: ci_evidence_seal
        if: steps.ci_evidence_capture.outcome == 'success'
        continue-on-error: true
        working-directory: agentic-graph
        run: |
          owner_inputs="$(node scripts/ci-evidence-inputs.mjs)"
          export "$owner_inputs"
          node node_modules/agentic-os/bin/agentic-os-ci-evidence.mjs seal --policy=.agentic-os-ci-evidence.json --before="$RUNNER_TEMP/ci-evidence-before.json" --output="$RUNNER_TEMP/evidence.json"

      - name: Retain protected CI source evidence
        if: steps.ci_evidence_seal.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentic-os-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Seal PR source-plan evidence
        if: steps.source_inputs.outcome == 'success'
        working-directory: agentic-graph
        run: |
          owner_inputs="$(node scripts/ci-evidence-inputs.mjs)"
          export "$owner_inputs"
          mkdir -p "$RUNNER_TEMP/source-evidence"
          node node_modules/agentic-os/bin/agentic-os-ci-evidence.mjs seal --policy=.agentic-os-ci-source-evidence.json --before="$RUNNER_TEMP/source-before.json" --output="$RUNNER_TEMP/source-evidence/evidence.json"

      - name: Retain PR source-plan evidence
        if: steps.source_inputs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentic-os-ci-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence/evidence.json
          if-no-files-found: error
          retention-days: 1
